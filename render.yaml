# Render Blueprint Specification (render.yaml)
# Deploy ReachInbox Email Scheduler Web Service on Render

services:
  # -------------------------------------------------------------
  # Web Service (Full-Stack Express API + BullMQ Worker + React SPA)
  # -------------------------------------------------------------
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npm run build && npx prisma db push"
    startCommand: "cd backend && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "200"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "50"
      # Database connection (Connect your existing Render Postgres, Supabase, Neon, or Railway DB)
      - key: DATABASE_URL
        sync: false
      # Redis connection (Connect your existing Render Redis, Upstash, or Redis Cloud)
      - key: REDIS_URL
        sync: false
      # Frontend URL
      - key: FRONTEND_URL
        value: http://localhost:5173
      # Google OAuth (Optional - Instant Demo Login works without keys)
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_CALLBACK_URL
        value: ""
